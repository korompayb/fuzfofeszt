<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FűzfőFeszt 26 | Kezdőlap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        /* FűzfőFeszt stílusok */
        body {
            background: linear-gradient(120deg, #f8fafc 0%, #e0e7ef 100%);
            font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
            color: #3a3a3a;
        }
        .navbar {
            background: #e6f2f0;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(60, 60, 60, 0.05);
        }
        .navbar-brand {
            font-family: 'Pacifico', cursive;
            font-weight: 700;
            color: #6c7a89;
            font-size: 2rem;
            letter-spacing: 2px;
        }
        .nav-link {
            color: #7b8fa1 !important;
            font-weight: 500;
            margin-right: 1rem;
            transition: color 0.2s;
        }
        .nav-link:hover {
            color: #a3c9c7 !important;
        }
        /* ... A többi FűzfőFeszt stílus ... */
        .hero {
            background: linear-gradient(90deg, #e6f2f0 60%, #f5e6f7 100%);
            border-radius: 24px;
            padding: 3rem 2rem;
            margin-bottom: 2rem;
            text-align: center;
            box-shadow: 0 4px 24px rgba(60, 60, 60, 0.08);
            position: relative;
            overflow: hidden;
        }
        .hero h1 {
            font-family: 'Pacifico', cursive;
            font-size: 3rem;
            color: #a3c9c7;
            margin-bottom: 1rem;
        }
        .hero p {
            font-size: 1.3rem;
            color: #6c7a89;
            margin-bottom: 2rem;
        }
        .hero .btn {
            font-size: 1.1rem;
            background: #a3c9c7;
            color: #fff;
            border-radius: 24px;
            padding: 0.7rem 2rem;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(163, 201, 199, 0.15);
        }
        .main {
            background: #f5f7fa;
            border-radius: 18px;
            padding: 2rem;
            box-shadow: 0 2px 12px rgba(60, 60, 60, 0.07);
            margin-bottom: 2rem;
        }
        .section-title {
            color: #6c7a89;
            font-weight: 700;
            margin-bottom: 1rem;
            font-size: 2rem;
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(60, 60, 60, 0.07);
            margin-bottom: 1.5rem;
        }
        .card-img-top {
            border-radius: 16px 16px 0 0;
            height: 180px;
            object-fit: cover;
        }
        .card-title {
            color: #a3c9c7;
            font-weight: 600;
        }
        .info-box {
            background: #e6f2f0;
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            color: #6c7a89;
        }
        .footer {
            text-align: center;
            color: #7b8fa1;
            padding: 1rem 0;
            font-size: 0.95rem;
            background: #e6f2f0;
            border-radius: 12px;
            margin-bottom: 1rem;
        }
        .social-icons a {
            color: #a3c9c7;
            font-size: 1.7rem;
            margin: 0 0.5rem;
            transition: color 0.2s;
        }
        .social-icons a:hover {
            color: #6c7a89;
        }
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2rem;
            }
            .main {
                padding: 1rem;
            }
            .navbar-brand {
                font-size: 1.2rem;
            }
        }
    </style>
    <script src="https://kit.fontawesome.com/7b7e2e1e6a.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container py-4">
        <nav class="navbar navbar-expand-lg mb-4">
            <a class="navbar-brand" href="#">FűzfőFeszt 26'</a>
            <ul class="nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#">Kezdőlap</a></li>
                <li class="nav-item"><a class="nav-link" href="#programok">Programok</a></li>
                <li class="nav-item"><a class="nav-link" href="#jegyek">Jegyek</a></li>
                <li class="nav-item"><a class="nav-link" href="#helyszin">Helyszín</a></li>
                <li class="nav-item"><a class="nav-link" href="#kapcsolat">Kapcsolat</a></li>
            </ul>
        </nav>

       
       
       
        <div class="footer">
            <p>&copy; 2025 FűzfőFeszt. Minden jog fenntartva.</p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
